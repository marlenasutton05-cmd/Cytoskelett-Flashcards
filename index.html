<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cytoskeleton Flashcards</title>
  <meta name="description" content="Flashcards, quiz, cloze, process ordering and comparison tables for Bio 112, lecture 4: the cytoskeleton.">
  <meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    /* apply saved theme before paint */
    try {
      var s = JSON.parse(localStorage.getItem("cyto-v04") || "{}");
      if (s.theme) document.documentElement.setAttribute("data-theme", s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="10" cy="14" r="5" fill="var(--actin)"/>
          <circle cx="20" cy="26" r="5" fill="var(--mt)"/>
          <circle cx="30" cy="14" r="5" fill="var(--if)"/>
        </svg>
        <div>
          <h1 class="brand-title" data-i18n="title">Das Cytoskelett</h1>
          <p class="brand-sub" data-i18n="subtitle">Bio 112, lecture 4</p>
        </div>
      </div>
      <div class="top-controls">
        <div class="seg seg-lang" role="group" aria-label="Language">
          <button type="button" data-action="lang" data-value="de">DE</button>
          <button type="button" data-action="lang" data-value="en">EN</button>
        </div>
        <button type="button" class="icon-btn" data-action="theme" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <nav class="modes" id="modes" aria-label="Study mode"></nav>
    <section class="filters" id="filters" aria-label="Filters"></section>

    <main id="stage" class="stage" tabindex="-1"></main>

    <footer class="foot" id="foot"></footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
